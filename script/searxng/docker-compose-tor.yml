services:
  # Tor proxy service
  tor:
    image: dperson/torproxy:latest
    container_name: tor-proxy
    restart: unless-stopped
    ports:
      - "9050:9050"   # SOCKS5 proxy
      - "9080:9080"   # HTTP proxy
    environment:
      - TOR_PROXY_PORT=9050
      - TOR_HTTP_PROXY_PORT=9080
    healthcheck:
      test: ["CMD-SHELL", "curl -x socks5://127.0.0.1:9050 https://check.torproject.org/api/ip || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # SearXNG using Tor
  searxng-tor:
    image: searxng/searxng:latest
    container_name: searxng-tor
    restart: unless-stopped
    ports:
      - "8890:8080"
    environment:
      - GRANIAN_HOST=0.0.0.0
      - SEARXNG_LIMITER=false
      - SEARXNG_SECRET_KEY=opencodex-tor-2026-z7f4k2m9r1t8
      - SEARXNG_BASE_URL=http://localhost:8890
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./searxng-settings-tor.yml:/etc/searxng/settings.yml
      - ./limiter.toml:/etc/searxng/limiter.toml
    depends_on:
      tor:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/config', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  default:
    name: searxng-tor-net